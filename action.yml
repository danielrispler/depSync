name: 'depSync'
description: 'Context-Aware AI Dependency Manager for Monorepos'
author: 'Your Name'

inputs:
  github-token:
    description: 'GitHub token for API access (usually secrets.GITHUB_TOKEN)'
    required: true
  jules-api-key:
    description: 'Jules REST API Key for autonomous AI dependency analysis'
    required: true
  notification-webhook-url:
    description: 'Webhook URL for batched depSync notifications'
    required: false
  notification-webhook-secret:
    description: 'Optional shared secret used to sign notification webhook payloads'
    required: false
  core-frameworks:
    description: 'Optional comma-separated list of framework/package names to prioritize'
    required: false

runs:
  using: 'node24'
  main: 'dist/index.js'
